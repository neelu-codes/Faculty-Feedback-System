<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academics</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workspace.css">
</head>
<body class="ws">
<main id="main">
  <div class="ws-page">
    <div class="ws-head">
      <h1>Academics</h1>
    </div>
    <div id="msg" role="alert" hidden></div>

    <div id="tabs">
      <div class="ws-tabs" role="tablist" aria-label="Academic data">
        <button class="ws-tab" role="tab" id="tab-dep" aria-controls="p-dep" data-tab="dep">Schools <span class="ws-count" id="c-dep">0</span></button>
        <button class="ws-tab" role="tab" id="tab-cls" aria-controls="p-cls" data-tab="cls">Classes <span class="ws-count" id="c-cls">0</span></button>
        <button class="ws-tab" role="tab" id="tab-fac" aria-controls="p-fac" data-tab="fac">Faculty <span class="ws-count" id="c-fac">0</span></button>
        <button class="ws-tab" role="tab" id="tab-sbj" aria-controls="p-sbj" data-tab="sbj">Subjects <span class="ws-count" id="c-sbj">0</span></button>
      </div>

      <!-- Schools -->
      <section id="p-dep" role="tabpanel" aria-labelledby="tab-dep">
        <div class="ws-panel-head">
          <div class="ws-section-header">
            <h2 tabindex="-1">Schools</h2>
          </div>
          <div class="ws-toolbar">
            <div class="ws-toolbar-filters">
              <div class="ws-field ws-search-field">
                <label for="q-dep" class="sr-only">Search schools</label>
                <div class="ws-input-icon-wrap">
                  <svg class="ws-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input type="search" id="q-dep" placeholder="Search schools..." autocomplete="off">
                </div>
              </div>
            </div>
            <button type="button" class="btn btn-primary" data-act="add" data-kind="dep">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add school</span>
            </button>
          </div>
        </div>
        <p class="ws-status" id="s-dep" role="status">Loading...</p>
        <div id="l-dep"></div>
      </section>

      <!-- Classes -->
      <section id="p-cls" role="tabpanel" aria-labelledby="tab-cls" hidden>
        <div class="ws-panel-head">
          <div class="ws-section-header">
            <h2 tabindex="-1">Classes</h2>
          </div>
          <div class="ws-toolbar">
            <div class="ws-toolbar-filters">
              <div class="ws-field ws-search-field">
                <label for="q-cls" class="sr-only">Search classes</label>
                <div class="ws-input-icon-wrap">
                  <svg class="ws-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input type="search" id="q-cls" placeholder="Search classes..." autocomplete="off">
                </div>
              </div>
              <div class="ws-field ws-field-sm">
                <label for="d-cls" class="sr-only">School</label>
                <select id="d-cls"></select>
              </div>
            </div>
            <button type="button" class="btn btn-primary" data-act="add" data-kind="cls">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add class</span>
            </button>
          </div>
        </div>
        <p class="ws-status" id="s-cls" role="status"></p>
        <div id="l-cls"></div>
      </section>

      <!-- Faculty -->
      <section id="p-fac" role="tabpanel" aria-labelledby="tab-fac" hidden>
        <div class="ws-panel-head">
          <div class="ws-section-header">
            <h2 tabindex="-1">Faculty</h2>
          </div>
          <div class="ws-toolbar">
            <div class="ws-toolbar-filters">
              <div class="ws-field ws-search-field">
                <label for="q-fac" class="sr-only">Search by name or school</label>
                <div class="ws-input-icon-wrap">
                  <svg class="ws-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input type="search" id="q-fac" placeholder="Search by name or school..." autocomplete="off">
                </div>
              </div>
              <div class="ws-field ws-field-sm">
                <label for="d-fac" class="sr-only">School</label>
                <select id="d-fac"></select>
              </div>
            </div>
            <button type="button" class="btn btn-primary" data-act="add" data-kind="fac">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add faculty</span>
            </button>
          </div>
        </div>
        <p class="ws-status" id="s-fac" role="status"></p>
        <div id="l-fac"></div>
      </section>

      <!-- Subjects -->
      <section id="p-sbj" role="tabpanel" aria-labelledby="tab-sbj" hidden>
        <div class="ws-panel-head">
          <div class="ws-section-header">
            <h2 tabindex="-1">Subjects</h2>
          </div>
          <div class="ws-toolbar">
            <div class="ws-toolbar-filters">
              <div class="ws-field ws-search-field">
                <label for="q-sbj" class="sr-only">Search by subject or teacher</label>
                <div class="ws-input-icon-wrap">
                  <svg class="ws-field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input type="search" id="q-sbj" placeholder="Search by subject or teacher..." autocomplete="off">
                </div>
              </div>
              <div class="ws-field ws-field-sm">
                <label for="d-sbj" class="sr-only">Class</label>
                <select id="d-sbj"></select>
              </div>
            </div>
            <button type="button" class="btn btn-primary" data-act="add" data-kind="sbj">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>Add subject</span>
            </button>
          </div>
        </div>
        <p class="ws-status" id="s-sbj" role="status"></p>
        <div id="l-sbj"></div>
      </section>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/ws-shell.js"></script>
<script src="js/pages/admin-academics.js"></script>
</body>
</html>
