<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/workspace.css">
</head>
<body class="ws">
<main id="main">
  <div class="ws-page">
    <div class="ws-head">
      <h1>Reports</h1>
    </div>
    <div id="msg" role="alert" hidden></div>

    <section id="p-perf">
      <!-- 3-Column Filter Grid Card -->
      <div class="ws-panel ws-filter-panel">
        <div class="ws-filter-grid">
          <div class="ws-field">
            <label for="fDept">School</label>
            <select id="fDept"></select>
          </div>
          <div class="ws-field">
            <label for="fFaculty">Faculty (optional)</label>
            <select id="fFaculty"></select>
          </div>
          <div class="ws-field">
            <label for="fClass">Class</label>
            <select id="fClass"></select>
          </div>
        </div>
      </div>

      <!-- Clickable Action Cards for Exports -->
      <div class="ws-export-grid">
        <div class="ws-action-card" id="cardAvg" tabindex="0" role="button" aria-label="Export averages report in Excel format">
          <div class="ws-action-card-top">
            <div class="ws-card-icon ws-icon-indigo">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
            </div>
            <div>
              <h3>Averages report</h3>
              <p class="ws-card-desc">One row per faculty, subject and class, with the average for each question. A school report lists every faculty member of that school.</p>
            </div>
          </div>
          <div class="ws-card-action">
            <button type="button" class="btn btn-primary" id="exportAvg">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Export averages (Excel)
            </button>
          </div>
        </div>

        <div class="ws-action-card" id="cardAll" tabindex="0" role="button" aria-label="Export all responses report in Excel format">
          <div class="ws-action-card-top">
            <div class="ws-card-icon ws-icon-blue">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div>
              <h3>All responses</h3>
              <p class="ws-card-desc">Every individual rating and comment that students submitted, one row per answer. No averages.</p>
            </div>
          </div>
          <div class="ws-card-action">
            <button type="button" class="btn btn-primary" id="exportAll">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Export all responses (Excel)
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/ws-shell.js"></script>
<script src="js/pages/admin-reports.js"></script>
</body>
</html>
