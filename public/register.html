<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Create a student account">
<title>Student Registration</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container narrow">
    <div class="card">
      <h1>Student registration</h1>
      <div id="msg" role="alert" hidden></div>
      <form id="regForm" novalidate>
        <div class="field"><label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" required aria-describedby="name-err"><div class="error-text" id="name-err"></div></div>
        <div class="field"><label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required aria-describedby="email-err"><div class="error-text" id="email-err"></div></div>
        <div class="field"><label for="rollNo"><span id="rollLabel">Roll / Register number</span><span class="hint" id="rollHint"></span></label>
          <input type="text" id="rollNo" required aria-describedby="rollNo-err"><div class="error-text" id="rollNo-err"></div></div>
        <div class="field"><label for="classId">Class</label>
          <select id="classId" required aria-describedby="classId-err"><option value="">Loading classes...</option></select>
          <div class="error-text" id="classId-err"></div></div>
        <div class="field"><label for="password">Password<span class="hint">At least 8 characters, with a letter and a number.</span></label>
          <input type="password" id="password" autocomplete="new-password" required aria-describedby="password-err"><div class="error-text" id="password-err"></div></div>
        <div class="field"><label for="confirm">Confirm password</label>
          <input type="password" id="confirm" autocomplete="new-password" required aria-describedby="confirm-err"><div class="error-text" id="confirm-err"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="center small" style="margin-top:1rem">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/register.js"></script>
</body>
</html>
