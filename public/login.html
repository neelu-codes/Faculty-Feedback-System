<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Log in to the faculty feedback system">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container narrow">
    <div class="card">
      <h1>Log in</h1>
      <p class="muted">Students and administrators use the same form.</p>
      <div id="msg" role="alert" hidden></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required aria-describedby="email-err">
          <div class="error-text" id="email-err"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="password-err">
            <button type="button" id="togglePw" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <div class="error-text" id="password-err"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <p class="center small" style="margin-top:1rem">New student? <a href="register.html">Create an account</a></p>
      <p class="center small muted">Forgot your password? Ask your administrator to reset it.</p>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
