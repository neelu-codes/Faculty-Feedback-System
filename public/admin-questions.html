<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container">
    <div class="page-head"><div><h1>Question bank</h1><p class="muted">Reusable questions for your surveys</p></div>
      <button class="btn btn-primary" id="addBtn">Add question</button></div>
    <div id="msg" role="alert" hidden></div>
    <div class="card">
      <div class="table-wrap"><table class="stack"><caption class="sr-only">Questions</caption>
        <thead><tr><th scope="col">Question</th><th scope="col">Type</th><th scope="col">Category</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
    </div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/admin-questions.js"></script>
</body>
</html>
