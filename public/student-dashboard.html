<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Surveys</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container">
    <div class="page-head">
      <div><h1>My surveys</h1><p class="muted" id="who"></p></div>
    </div>
    <div class="grid grid-3" id="counts" aria-label="Summary"></div>
    <div id="msg" role="alert" hidden></div>
    <h2 style="margin-top:1.5rem">Pending</h2>
    <div id="pending" class="stack" aria-live="polite"><p class="empty">Loading...</p></div>
    <h2 style="margin-top:1.5rem">Completed or closed</h2>
    <div id="done" class="stack"></div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/student-dashboard.js"></script>
</body>
</html>
