<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surveys</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
  <div class="container">
    <div class="page-head"><div><h1>Surveys</h1><p class="muted">Create and manage feedback surveys</p></div>
      <button class="btn btn-primary" id="newBtn">New survey</button></div>
    <div id="msg" role="alert" hidden></div>

    <section id="builder" class="card" hidden aria-labelledby="bt">
      <h2 id="bt">New survey</h2>
      <div id="bmsg" role="alert" hidden></div>
      <form id="surveyForm" novalidate>
        <div class="grid grid-2">
          <div class="field"><label for="title">Title</label><input type="text" id="title" maxlength="120" required></div>
          <div class="field"><label for="classId">Class</label><select id="classId" required></select></div>
          <div class="field"><label for="desc">Description <span class="hint">Shown to students (optional)</span></label><input type="text" id="desc" maxlength="500"></div>
          <div class="field"><label for="closes">Closing date <span class="hint">Optional</span></label><input type="date" id="closes"></div>
        </div>
        <div class="grid grid-2">
          <fieldset><legend>Faculty to rate</legend><div class="check-list" id="facList"></div></fieldset>
          <fieldset><legend>Questions</legend><div class="check-list" id="qList"></div></fieldset>
        </div>
        <div class="row"><button class="btn btn-primary" type="submit" id="saveBtn">Save survey</button><button class="btn" type="button" id="cancelBtn">Cancel</button></div>
      </form>
    </section>

    <div class="card" style="margin-top:1rem"><div class="table-wrap"><table class="stack"><caption class="sr-only">All surveys</caption>
      <thead><tr><th scope="col">Title</th><th scope="col">Class</th><th scope="col">Status</th><th scope="col">Responses</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
      <tbody id="rows"></tbody></table></div></div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/admin-surveys.js"></script>
</body>
</html>
